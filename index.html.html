<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heltec Dual GPS Tracker</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background-color: #121212; color: #fff; }
    
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background-color: #1e1e1e; border-bottom: 1px solid #333; }
    h1 { font-size: 1.1rem; font-weight: 600; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn { background-color: #007bff; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.85rem; }
    .btn:hover { background-color: #0056b3; }
    .btn-secondary { background-color: #333; color: #ccc; border: 1px solid #555; }
    .btn-secondary:hover { background-color: #444; color: #fff; }
    
    #status-bar { display: flex; flex-wrap: wrap; gap: 15px; padding: 10px 20px; background-color: #252525; font-size: 0.85rem; border-bottom: 1px solid #333; }
    .status-item { display: flex; gap: 6px; align-items: center; }
    .label { color: #aaa; }
    .value { font-weight: 600; color: #00e676; }
    
    #map { flex: 1; width: 100%; }

    /* Custom Marker Colors */
    .marker-pin-tx { filter: hue-rotate(140deg); } /* Red icon for transmitter */
    .marker-pin-user { filter: hue-rotate(0deg); }   /* Blue icon for user phone */
  </style>
</head>
<body>

  <header>
    <h1>Heltec & Phone GPS Tracker</h1>
    <div class="btn-group">
      <button id="fitBoundsBtn" class="btn btn-secondary">Fit Both</button>
      <button id="connectBtn" class="btn">Connect BLE GPS</button>
    </div>
  </header>

  <div id="status-bar">
    <div class="status-item"><span class="label">BLE:</span><span id="bleStatus" class="value" style="color: #ff5252;">Disconnected</span></div>
    <div class="status-item"><span class="label">Phone GPS:</span><span id="phoneStatus" class="value" style="color: #ffb300;">Acquiring...</span></div>
    <div class="status-item"><span class="label">Target Lat/Lng:</span><span id="targetCoords" class="value">--</span></div>
    <div class="status-item"><span class="label">Distance:</span><span id="distanceVal" class="value" style="color: #00b0ff;">--</span></div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // BLE Configuration
    const SERVICE_UUID           = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    // DOM Elements
    const connectBtn   = document.getElementById('connectBtn');
    const fitBoundsBtn = document.getElementById('fitBoundsBtn');
    const bleStatus    = document.getElementById('bleStatus');
    const phoneStatus  = document.getElementById('phoneStatus');
    const targetCoords = document.getElementById('targetCoords');
    const distanceVal  = document.getElementById('distanceVal');

    // Global State
    let bleDevice, gattServer, txCharacteristic;
    let nmeaBuffer = "";
    
    let phoneLatLng  = null;
    let targetLatLng = null;

    // Leaflet Map Initialization
    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Marker Icons
    const blueIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    const redIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    let userMarker = null;
    let userAccuracyCircle = null;
    let targetMarker = null;
    let pathPolyline = L.polyline([], { color: '#ff5252', weight: 4 }).addTo(map);

    // --- 1. Phone GPS Geolocation Watcher ---
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          phoneLatLng = [lat, lng];
          phoneStatus.innerText = "Active";
          phoneStatus.style.color = "#00e676";

          if (!userMarker) {
            userMarker = L.marker(phoneLatLng, { icon: blueIcon }).addTo(map).bindPopup("You (Phone)");
            userAccuracyCircle = L.circle(phoneLatLng, { radius: accuracy, color: '#007bff', opacity: 0.3, fillColor: '#007bff', fillOpacity: 0.1 }).addTo(map);
            if (!targetLatLng) map.setView(phoneLatLng, 16);
          } else {
            userMarker.setLatLng(phoneLatLng);
            userAccuracyCircle.setLatLng(phoneLatLng);
            userAccuracyCircle.setRadius(accuracy);
          }

          updateDistance();
        },
        (error) => {
          console.warn("Phone GPS Error:", error.message);
          phoneStatus.innerText = "Denied / Error";
          phoneStatus.style.color = "#ff5252";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    } else {
      phoneStatus.innerText = "Unsupported";
      phoneStatus.style.color = "#ff5252";
    }

    // --- 2. Distance Calculation ---
    function updateDistance() {
      if (phoneLatLng && targetLatLng) {
        const p1 = L.latLng(phoneLatLng[0], phoneLatLng[1]);
        const p2 = L.latLng(targetLatLng[0], targetLatLng[1]);
        const meters = p1.distanceTo(p2);

        if (meters >= 1000) {
          distanceVal.innerText = (meters / 1000).toFixed(2) + " km";
        } else {
          distanceVal.innerText = Math.round(meters) + " m";
        }
      }
    }

    // --- 3. NMEA Coordinates Parser ---
    function parseNmeaCoord(coordStr, dir) {
      if (!coordStr || !dir) return null;
      let degLength = (dir === 'N' || dir === 'S') ? 2 : 3;
      let degrees = parseFloat(coordStr.slice(0, degLength));
      let minutes = parseFloat(coordStr.slice(degLength));
      let decimal = degrees + (minutes / 60.0);
      if (dir === 'S' || dir === 'W') decimal = -decimal;
      return decimal;
    }

    function parseNmeaSentence(sentence) {
      if (!sentence.startsWith('$GPGGA') && !sentence.startsWith('$GNGGA')) return;

      const parts = sentence.split(',');
      if (parts.length >= 6) {
        const rawLat = parts[2];
        const latDir = parts[3];
        const rawLng = parts[4];
        const lngDir = parts[5];

        const lat = parseNmeaCoord(rawLat, latDir);
        const lng = parseNmeaCoord(rawLng, lngDir);

        if (lat !== null && lng !== null && !isNaN(lat) && !isNaN(lng)) {
          updateTargetLocation(lat, lng);
        }
      }
    }

    // --- 4. Update Heltec Target Location ---
    function updateTargetLocation(lat, lng) {
      targetLatLng = [lat, lng];
      targetCoords.innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

      if (!targetMarker) {
        targetMarker = L.marker(targetLatLng, { icon: redIcon }).addTo(map).bindPopup("Transmitter Unit");
        if (!userLatLng) map.setView(targetLatLng, 16);
      } else {
        targetMarker.setLatLng(targetLatLng);
      }

      pathPolyline.addLatLng(targetLatLng);
      updateDistance();
    }

    // --- 5. BLE Connection Handler ---
    async function connectBLE() {
      try {
        bleStatus.innerText = "Searching...";
        bleStatus.style.color = "#ffb300";

        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Heltec-GPS-RX' }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        gattServer = await bleDevice.gatt.connect();
        const service = await gattServer.getPrimaryService(SERVICE_UUID);
        txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);

        bleStatus.innerText = "Connected";
        bleStatus.style.color = "#00e676";
        connectBtn.innerText = "Disconnect";
      } catch (error) {
        console.error("BLE Error:", error);
        bleStatus.innerText = "Error / Cancelled";
        bleStatus.style.color = "#ff5252";
      }
    }

    function handleBLEData(event) {
      const decoder = new TextDecoder('utf-8');
      const chunk = decoder.decode(event.target.value);
      nmeaBuffer += chunk;

      let lines = nmeaBuffer.split('\n');
      nmeaBuffer = lines.pop();

      for (let line of lines) {
        if (line.trim().length > 0) {
          parseNmeaSentence(line);
        }
      }
    }

    function onDisconnected() {
      bleStatus.innerText = "Disconnected";
      bleStatus.style.color = "#ff5252";
      connectBtn.innerText = "Connect BLE GPS";
    }

    // Center map view on both markers
    fitBoundsBtn.addEventListener('click', () => {
      const bounds = [];
      if (phoneLatLng) bounds.push(phoneLatLng);
      if (targetLatLng) bounds.push(targetLatLng);

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    });

    connectBtn.addEventListener('click', () => {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      } else {
        connectBLE();
      }
    });
  </script>
</body>
</html>
